name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      # les types Cloudflare du Worker (tsconfig du Worker) vivent dans worker/node_modules
      - run: npm ci --prefix worker
      - run: npm run check
      - run: npm run build
